
name: 同步上游并构建个人镜像

on:
  schedule:
    # 每天 04:17 UTC 自动检查上游更新
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write

concurrency:
  group: upstream-sync-custom-cron
  cancel-in-progress: false

jobs:
  sync:
    name: 同步 Marchen-orz/MiyoQian
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      conflict: ${{ steps.sync.outputs.conflict }}
      ref: ${{ steps.sync.outputs.ref }}
      files: ${{ steps.sync.outputs.files }}

    steps:
      - name: Checkout personal branch
        uses: actions/checkout@v4
        with:
          ref: custom/cron
          fetch-depth: 0

      - name: Fetch upstream and merge safely
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Marchen-orz/MiyoQian.git
          git fetch upstream master
          git fetch origin \
            +refs/heads/master:refs/remotes/origin/master \
            +refs/heads/custom/cron:refs/remotes/origin/custom/cron

          # 检查 Fork master 是否可以安全快进到上游 master。
          if ! git merge-base --is-ancestor refs/remotes/origin/master refs/remotes/upstream/master; then
            echo "Fork 的 master 不能快进到上游 master；为避免覆盖，停止同步。"
            exit 1
          fi

          git checkout -B custom/cron refs/remotes/origin/custom/cron
          before="$(git rev-parse HEAD)"

          # 尝试合并上游更新，暂不自动创建合并提交。
          merge_failed=false

          if git merge --no-commit --no-ff refs/remotes/upstream/master; then
            echo "上游合并命令执行成功。"
          else
            merge_failed=true
            echo "检测到合并未能直接完成，开始检查冲突。"
          fi

          conflict_files="$(git diff --name-only --diff-filter=U || true)"

          # 合并失败但没有普通文件冲突，说明可能是其他 Git 错误。
          if [ "$merge_failed" = "true" ] && [ -z "$conflict_files" ]; then
            echo "合并失败，但没有检测到普通文件冲突。"
            git merge --abort || true
            exit 1
          fi

          # 自动解决两个个人定制文件的冲突，保留 Fork 版本。
          for path in \
            ".github/workflows/docker.yml" \
            "docker/docker-compose.image.yml"
          do
            if git ls-files -u -- "$path" | grep -q .; then
              echo "自动解决个人定制文件冲突，保留 Fork 版本：$path"
              git checkout --ours -- "$path"
              git add -- "$path"
            fi
          done

          # 检查是否仍有其他文件冲突。
          remaining_conflicts="$(git diff --name-only --diff-filter=U || true)"

          if [ -n "$remaining_conflicts" ]; then
            echo "发现无法自动处理的其他冲突，停止本次同步："
            echo "$remaining_conflicts"

            git merge --abort

            {
              echo "conflict=true"
              echo "changed=false"
              echo "ref=$before"
              echo "files<<EOF"
              echo "$remaining_conflicts"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            exit 0
          fi

          # 如果存在合并任务，始终恢复两个个人定制文件的原始版本。
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git checkout "$before" -- \
              ".github/workflows/docker.yml" \
              "docker/docker-compose.image.yml"

            git add -- \
              ".github/workflows/docker.yml" \
              "docker/docker-compose.image.yml"

            # 提交合并结果。
            git commit --no-edit
          fi

          after="$(git rev-parse HEAD)"

          # 原子推送 Fork master 和个人定制分支。
          git push --atomic origin \
            refs/remotes/upstream/master:refs/heads/master \
            HEAD:refs/heads/custom/cron

          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "ref=$after" >> "$GITHUB_OUTPUT"

          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "custom/cron 已包含全部上游更新，无需重新构建镜像。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "上游更新已合并并推送，准备构建个人镜像。"
          fi

      - name: Create or update conflict notification issue
        if: steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICT_FILES: ${{ steps.sync.outputs.files }}
        shell: bash
        run: |
          set -euo pipefail

          title="上游同步发生冲突：请检查 custom/cron"
          existing="$(gh issue list \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')"

          body=$(cat <<EOF
          自动同步上游 Marchen-orz/MiyoQian:master 时发生无法自动解决的合并冲突。

          **没有强制覆盖或推送任何冲突内容。**

          以下文件需要人工检查：

          $CONFLICT_FILES

          请解决冲突后重新运行「同步上游并构建个人镜像」工作流。
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  build:
    name: 构建并发布个人 GHCR 镜像
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      ref: ${{ needs.sync.outputs.ref }}
