# 使用个人 Fork 发布的预构建镜像：ghcr.io/2375399351/miyouqian:latest
# 更新：docker compose pull && docker compose up -d
services:
  miyouqian:
    image: ghcr.io/2375399351/miyouqian:latest
    container_name: miyouqian
    restart: unless-stopped
    init: true
    ports:
      - "5890:5890"
    volumes:
      - miyouqian_state:/app/state
    environment:
      - TZ=Asia/Shanghai
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  miyouqian_state:
    name: miyouqian_state
